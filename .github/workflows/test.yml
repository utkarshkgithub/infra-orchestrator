name: test

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PNPM_VERSION: 11.5.3
  NODE_VERSION: 22

jobs:
  unit:
    name: Unit tests + coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter backend exec prisma generate

      - name: Backend unit tests with coverage
        run: pnpm --filter backend test:coverage
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/db
          GITHUB_CLIENT_ID: ci-client-id
          GITHUB_CLIENT_SECRET: ci-client-secret
          GITHUB_CALLBACK_URL: https://api.example.com/auth/github/callback
          JWT_SECRET: ci-jwt-secret
          BACKEND_SERVICE_TOKEN: ci-service-token

      - name: Infra (CDK) tests
        run: pnpm --filter infra test

      - name: Upload backend coverage report
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: apps/backend/coverage

  typecheck:
    name: Typecheck backend + executor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck backend
        run: pnpm --filter backend exec tsc --noEmit -p tsconfig.json

      - name: Typecheck executor
        run: pnpm --filter executor exec tsc --noEmit -p tsconfig.json

  integration:
    name: Integration tests (Floci SQS)
    runs-on: ubuntu-latest
    services:
      floci:
        image: floci/floci:1.5.33
        ports:
          - 4566:4566
        env:
          FLOCI_STORAGE_MODE: memory
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter backend exec prisma generate

      - name: Queue -> worker integration tests
        run: pnpm --filter backend test
        env:
          RUN_INTEGRATION: "true"
          FLOCI_ENDPOINT: http://localhost:4566
          DATABASE_URL: postgresql://user:pass@localhost:5432/db
          GITHUB_CLIENT_ID: ci-client-id
          GITHUB_CLIENT_SECRET: ci-client-secret
          GITHUB_CALLBACK_URL: https://api.example.com/auth/github/callback
          JWT_SECRET: ci-jwt-secret
          BACKEND_SERVICE_TOKEN: ci-service-token